<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPDB SMP Negeri 2 Karamat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; padding: 20px; margin: 0; }
        .container { max-width: 650px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #4b5563; font-size: 14px; margin-top: 0; margin-bottom: 20px; }
        
        /* Navigasi Tab Menu */
        .tab-menu { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; }
        .tab-btn { flex: 1; padding: 10px; background: #f3f4f6; border: none; font-weight: bold; color: #4b5563; cursor: pointer; border-radius: 6px 6px 0 0; }
        .tab-btn.active { background: #2563eb; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #374151; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        
        /* Styling Hasil Status */
        .status-box { padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; font-weight: bold; }
        .status-diterima { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .status-ditolak { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .status-proses { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }

        /* Tabel Petugas */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
        th, td { border: 1px solid #e5e7eb; padding: 8px; text-align: left; }
        th { background: #f9fafb; }
    </style>
</head>
<body>

<div class="container">
    <h2>PPDB Online</h2>
    <p class="subtitle">SMP Negeri 2 Karamat</p>

    <!-- Navigasi Menu -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="openTab('formTab', this)">Formulir</button>
        <button class="tab-btn" onclick="openTab('statusTab', this)">Cek Status</button>
        <button class="tab-btn" onclick="openTab('petugasTab', this)">Menu Petugas</button>
    </div>

    <!-- TAB 1: FORMULIR PENDAFTARAN -->
    <div id="formTab" class="tab-content active">
        <form id="formPendaftaran">
            <div class="form-group"><label>NISN</label><input type="number" id="nisn" required></div>
            <div class="form-group"><label>NIK Siswa</label><input type="number" id="nik" required></div>
            <div class="form-group"><label>No. KK</label><input type="number" id="no_kk" required></div>
            <div class="form-group"><label>Nama Lengkap</label><input type="text" id="nama" required></div>
            <div class="form-group">
                <label>Jalur Pendaftaran</label>
                <select id="jalur" required>
                    <option value="">-- Pilih Jalur --</option>
                    <option value="Zonasi">Zonasi</option>
                    <option value="Afirmasi">Afirmasi</option>
                    <option value="Prestasi">Prestasi</option>
                    <option value="Perpindahan Ortu">Perpindahan Tugas Orang Tua</option>
                </select>
            </div>
            <div class="form-group"><label>No WhatsApp Ortu</label><input type="tel" id="wa" required></div>
            <div class="form-group"><label>Unggah Berkas Pendukung (PDF/Gambar)</label><input type="file" id="berkas" accept=".pdf,.jpg,.jpeg,.png" required></div>
            <div class="form-group"><label>Unggah Swafoto Siswa</label><input type="file" id="foto" accept="image/*" required></div>
            <div class="form-group">
                <button type="button" onclick="dapatkanLokasi()">1. Ambil Lokasi Rumah Saya</button>
                <p id="lokasiText" style="font-size: 12px; color: #4b5563; text-align: center; margin-top: 5px;"></p>
            </div>
            <input type="hidden" id="latitude"><input type="hidden" id="longitude">
            <button type="submit" id="btnSubmit" disabled>2. Kirim Pendaftaran</button>
        </form>
        <div id="statusForm" style="margin-top:15px; text-align:center;"></div>
    </div>

    <!-- TAB 2: CEK STATUS PENDAFTARAN -->
    <div id="statusTab" class="tab-content">
        <div class="form-group">
            <label>Masukkan NISN Calon Siswa</label>
            <input type="number" id="searchNisn" placeholder="Contoh: 0081234567">
        </div>
        <button onclick="cekStatusSiswa()">Cek Hasil Seleksi</button>
        <div id="hasilCekStatus"></div>
    </div>

    <!-- TAB 3: MENU PETUGAS -->
    <div id="petugasTab" class="tab-content">
        <div id="loginPetugasView">
            <div class="form-group">
                <label>Masukkan PIN Petugas</label>
                <input type="password" id="pinPetugas" placeholder="PIN Rahasia">
            </div>
            <button onclick="loadDataPetugas()">Masuk Panel Petugas</button>
        </div>
        
        <div id="panelPetugasView" style="display:none;">
            <h3>Data Pendaftar PPDB</h3>
            <button onclick="loadDataPetugas()" style="background:#059669; margin-bottom:10px;">Refresh Data</button>
            <div style="overflow-x:auto;">
                <table id="tabelPetugas">
                    <thead>
                        <tr>
                            <th>NISN & Nama</th>
                            <th>Jalur / Jarak</th>
                            <th>Berkas</th>
                            <th>Status Saat Ini</th>
                            <th>Aksi Ubah Status</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/library/d/1_9hzHuPDWgMDszg7QeS00kK_n74U3Rb9ovmWnoLTWhY3wDPqn2vA8BAg/13;

    function openTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    // --- SCRIPT FORMULIR ---
    function dapatkanLokasi() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                document.getElementById('latitude').value = pos.coords.latitude;
                document.getElementById('longitude').value = pos.coords.longitude;
                document.getElementById('lokasiText').innerText = "Lokasi dikunci!";
                const btn = document.getElementById('btnSubmit');
                btn.disabled = false;
                btn.style.background = "#2563eb";
            });
        }
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    document.getElementById('formPendaftaran').addEventListener('submit', async function(e) {
        e.preventDefault();
        const statusForm = document.getElementById('statusForm');
        statusForm.innerText = "Mengirim data...";
        
        const berkasFile = document.getElementById('berkas').files[0];
        const fotoFile = document.getElementById('foto').files[0];

        const payload = {
            nisn: document.getElementById('nisn').value,
            nik: document.getElementById('nik').value,
            no_kk: document.getElementById('no_kk').value,
            nama: document.getElementById('nama').value,
            jalur: document.getElementById('jalur').value,
            wa: document.getElementById('wa').value,
            berkasBase64: await fileToBase64(berkasFile),
            berkasExt: berkasFile.name.split('.').pop(),
            berkasMime: berkasFile.type,
            fotoBase64: await fileToBase64(fotoFile),
            latitude: parseFloat(document.getElementById('latitude').value),
            longitude: parseFloat(document.getElementById('longitude').value)
        };

        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(data => {
            if(data.result === 'success') {
                statusForm.innerText = "Pendaftaran Berhasil! Jarak: " + data.jarak + " meter.";
                document.getElementById('formPendaftaran').reset();
            }
        });
    });

    // --- SCRIPT CEK STATUS ---
    function cekStatusSiswa() {
        const nisn = document.getElementById('searchNisn').value;
        const hasilDiv = document.getElementById('hasilCekStatus');
        if(!nisn) return alert("Isi NISN terlebih dahulu!");
        
        hasilDiv.innerHTML = "Mencari data...";
        fetch(`${SCRIPT_URL}?action=cekStatus&nisn=${nisn}`)
        .then(res => res.json())
        .then(res => {
            if(res.result === "success") {
                let d = res.data;
                let cssClass = d.status === "DITERIMA" ? "status-diterima" : (d.status === "DITOLAK" ? "status-ditolak" : "status-proses");
                hasilDiv.innerHTML = `
                    <div class="status-box ${cssClass}">
                        <p style="margin:0;">Nama: <b>${d.nama}</b> (${d.nisn})</p>
                        <p style="margin:5px 0;">Jalur: ${d.jalur} | Jarak: ${d.jarak} M</p>
                        <h3 style="margin:5px 0;">STATUS: ${d.status}</h3>
                    </div>
                `;
            } else {
                hasilDiv.innerHTML = `<div class="status-box status-ditolak">${res.message}</div>`;
            }
        });
    }

    // --- SCRIPT PETUGAS ---
    let currentPin = "";
    function loadDataPetugas() {
        const pin = document.getElementById('pinPetugas').value || currentPin;
        fetch(`${SCRIPT_URL}?action=getPetugasData&pin=${pin}`)
        .then(res => res.json())
        .then(res => {
            if(res.result === "success") {
                currentPin = pin;
                document.getElementById('loginPetugasView').style.display = "none";
                document.getElementById('panelPetugasView').style.display = "block";
                
                let tbody = document.querySelector('#tabelPetugas tbody');
                tbody.innerHTML = "";
                res.data.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td><b>${item.nama}</b><br>NISN: ${item.nisn}</td>
                            <td>${item.jalur}<br>${item.jarak} Meter</td>
                            <td>
                                <a href="${item.berkas}" target="_blank">Berkas</a> | 
                                <a href="${item.foto}" target="_blank">Foto</a>
                            </td>
                            <td><b>${item.status}</b></td>
                            <td>
                                <select onchange="updateStatusSiswa(${item.row}, this.value)">
                                    <option value="">-- Ubah --</option>
                                    <option value="DITERIMA">Diterima</option>
                                    <option value="DITOLAK">Ditolak</option>
                                    <option value="Sedang Diproses">Pending</option>
                                </select>
                            </td>
                        </tr>
                    `;
                });
            } else {
                alert(res.message);
            }
        });
    }

    function updateStatusSiswa(row, newStatus) {
        if(!newStatus) return;
        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "updateStatus", pin: currentPin, row: row, status: newStatus })
        })
        .then(res => res.json())
        .then(res => {
            if(res.result === 'success') {
                alert("Status berhasil diperbarui!");
                loadDataPetugas();
            }
        });
    }
</script>

</body>
</html>
