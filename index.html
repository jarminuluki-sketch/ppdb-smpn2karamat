<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPDB Online SMP Negeri 2 Karamat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; padding: 20px; margin: 0; }
        .container { max-width: 650px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #4b5563; font-size: 14px; margin-top: 0; margin-bottom: 20px; }
        
        /* Tab Menu Styling */
        .tab-menu { display: flex; gap: 5px; margin-bottom: 25px; border-bottom: 2px solid #e5e7eb; }
        .tab-btn { flex: 1; padding: 12px; background: #f3f4f6; border: none; font-weight: bold; color: #4b5563; cursor: pointer; border-radius: 6px 6px 0 0; transition: 0.2s; }
        .tab-btn.active { background: #2563eb; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #374151; font-size: 14px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        
        /* Status Display */
        .status-box { padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; font-weight: bold; }
        .status-diterima { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .status-ditolak { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .status-proses { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }

        /* Tabel Petugas */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #e5e7eb; padding: 10px; text-align: left; }
        th { background: #f9fafb; }
        .btn-update { background: #059669; padding: 6px 10px; font-size: 12px; margin-top: 5px; }
        .btn-sheets { background: #10b981; color: white; padding: 8px 12px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 12px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <h2>PPDB Online</h2>
    <p class="subtitle">SMP Negeri 2 Karamat</p>

    <!-- Navigasi Menu Tab -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="openTab('formTab', this)">Formulir</button>
        <button class="tab-btn" onclick="openTab('statusTab', this)">Cek Status</button>
        <button class="tab-btn" onclick="openTab('petugasTab', this)">Menu Petugas</button>
    </div>

    <!-- TAB 1: FORMULIR -->
    <div id="formTab" class="tab-content active">
        <form id="formPendaftaran">
            <div class="form-group"><label>NISN</label><input type="number" id="nisn" required placeholder="10 digit NISN"></div>
            <div class="form-group"><label>NIK Siswa</label><input type="number" id="nik" required placeholder="16 digit NIK"></div>
            <div class="form-group"><label>No. KK</label><input type="number" id="no_kk" required placeholder="16 digit No. KK"></div>
            <div class="form-group"><label>Nama Lengkap</label><input type="text" id="nama" required placeholder="Sesuai ijazah SD"></div>
            <div class="form-group">
                <label>Jalur Pendaftaran</label>
                <select id="jalur" required>
                    <option value="">-- Pilih Jalur --</option>
                    <option value="Zonasi">Zonasi</option>
                    <option value="Afirmasi">Afirmasi</option>
                    <option value="Prestasi">Prestasi</option>
                    <option value="Perpindahan Ortu">Perpindahan Tugas Orang Tua</option>
                </select>
            </div>
            <div class="form-group"><label>No WhatsApp Ortu</label><input type="tel" id="wa" required placeholder="08xxxxxxxxxx"></div>
            <div class="form-group"><label>Unggah Berkas Pendukung (PDF/Gambar)</label><input type="file" id="berkas" accept=".pdf,.jpg,.jpeg,.png" required></div>
            <div class="form-group"><label>Unggah Swafoto Siswa</label><input type="file" id="foto" accept="image/*" required></div>
            
            <div class="form-group">
                <button type="button" onclick="dapatkanLokasi()">1. Ambil Lokasi Rumah Saya</button>
                <p id="lokasiText" style="font-size: 12px; color: #4b5563; text-align: center; margin-top: 5px;"></p>
            </div>
            
            <input type="hidden" id="latitude"><input type="hidden" id="longitude">
            <button type="submit" id="btnSubmit" disabled>2. Kirim Pendaftaran</button>
        </form>
        <div id="statusForm" style="margin-top:15px; text-align:center; font-weight:bold;"></div>
    </div>

    <!-- TAB 2: CEK STATUS -->
    <div id="statusTab" class="tab-content">
        <div class="form-group">
            <label>Masukkan NISN Calon Siswa</label>
            <input type="number" id="searchNisn" placeholder="Contoh: 0081234567">
        </div>
        <button onclick="cekStatusSiswa()" id="btnCek">Cek Hasil Seleksi</button>
        <div id="hasilCekStatus"></div>
    </div>

    <!-- TAB 3: MENU PETUGAS -->
    <div id="petugasTab" class="tab-content">
        <div id="loginPetugasView">
            <div class="form-group">
                <label>Masukkan PIN Petugas</label>
                <input type="password" id="pinPetugas" placeholder="PIN Rahasia (Bawaan: 123456)">
            </div>
            <button onclick="loadDataPetugas()">Masuk Panel Petugas</button>
        </div>
        
        <div id="panelPetugasView" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <h3 style="margin:0;">Data Pendaftar</h3>
                <div>
                    <!-- Tombol Buka Spreadsheet Langsung -->
                    <a href="https://script.google.com/macros/s/AKfycbyxu-zkPAEzuvSKoOH4s8JPcUCxIQzdW9nLycQrRXQ8l9I7s5FzBfFS__LWXZLG3ba7/exec" target="_blank" class="btn-sheets">📊 Buka Google Sheets</a>
                    <button onclick="loadDataPetugas()" style="width:auto; background:#059669; padding:8px 15px; display:inline-block;">Refresh</button>
                </div>
            </div>
            <div style="overflow-x:auto;">
                <table id="tabelPetugas">
                    <thead>
                        <tr>
                            <th>Siswa</th>
                            <th>Jalur/Jarak</th>
                            <th>Berkas</th>
                            <th>Status & Aksi</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "URL_WEB_APP_BARU_ANDA_DI_SINI";

    function openTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    // --- FORMULIR ---
    function dapatkanLokasi() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                document.getElementById('latitude').value = pos.coords.latitude;
                document.getElementById('longitude').value = pos.coords.longitude;
                document.getElementById('lokasiText').innerText = "Lokasi Berhasil Dikunci!";
                const btn = document.getElementById('btnSubmit');
                btn.disabled = false;
                btn.style.background = "#2563eb";
            }, () => alert("Gagal mengambil lokasi. Aktifkan GPS Anda."));
        }
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    document.getElementById('formPendaftaran').addEventListener('submit', async function(e) {
        e.preventDefault();
        const statusForm = document.getElementById('statusForm');
        statusForm.innerText = "Mengunggah data & berkas...";
        statusForm.style.color = "blue";
        
        const berkasFile = document.getElementById('berkas').files[0];
        const fotoFile = document.getElementById('foto').files[0];

        const payload = {
            action: "daftarBaru",
            nisn: document.getElementById('nisn').value,
            nik: document.getElementById('nik').value,
            no_kk: document.getElementById('no_kk').value,
            nama: document.getElementById('nama').value,
            jalur: document.getElementById('jalur').value,
            wa: document.getElementById('wa').value,
            berkasBase64: await fileToBase64(berkasFile),
            berkasExt: berkasFile.name.split('.').pop(),
            berkasMime: berkasFile.type,
            fotoBase64: await fileToBase64(fotoFile),
            latitude: parseFloat(document.getElementById('latitude').value),
            longitude: parseFloat(document.getElementById('longitude').value)
        };

        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(data => {
            if(data.result === 'success') {
                statusForm.innerText = "Pendaftaran Berhasil! Jarak ke sekolah: " + data.jarak + " meter.";
                statusForm.style.color = "green";
                document.getElementById('formPendaftaran').reset();
            } else {
                statusForm.innerText = "Gagal: " + data.message;
                statusForm.style.color = "red";
            }
        });
    });

    // --- CEK STATUS ---
    function cekStatusSiswa() {
        const nisn = document.getElementById('searchNisn').value.trim();
        const hasilDiv = document.getElementById('hasilCekStatus');
        if(!nisn) return alert("Masukkan NISN terlebih dahulu!");

        hasilDiv.innerHTML = "<p style='text-align:center;'>Mencari data...</p>";

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "cekStatus", nisn: nisn })
        })
        .then(res => res.json())
        .then(res => {
            if(res.result === "success") {
                let d = res.data;
                let css = d.status === "DITERIMA" ? "status-diterima" : (d.status === "DITOLAK" ? "status-ditolak" : "status-proses");
                hasilDiv.innerHTML = `
                    <div class="status-box ${css}">
                        <p style="margin:0;">Nama: <b>${d.nama}</b> (NISN: ${d.nisn})</p>
                        <p style="margin:5px 0;">Jalur: ${d.jalur} | Jarak: ${d.jarak} Meter</p>
                        <h3 style="margin:8px 0;">STATUS: ${d.status}</h3>
                        ${d.catatan ? `<p style="margin:0; font-size:12px;">Catatan: ${d.catatan}</p>` : ''}
                    </div>
                `;
            } else {
                hasilDiv.innerHTML = `<div class="status-box status-ditolak">${res.message}</div>`;
            }
        })
        .catch(() => {
            hasilDiv.innerHTML = `<div class="status-box status-ditolak">Terjadi kesalahan koneksi.</div>`;
        });
    }

    // --- PETUGAS ---
    let currentPin = "";
    function loadDataPetugas() {
        const pin = document.getElementById('pinPetugas').value.trim() || currentPin;
        if(!pin) return alert("Masukkan PIN Petugas!");

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "getPetugasData", pin: pin })
        })
        .then(res => res.json())
        .then(res => {
            if(res.result === "success") {
                currentPin = pin;
                document.getElementById('loginPetugasView').style.display = "none";
                document.getElementById('panelPetugasView').style.display = "block";
                
                let tbody = document.querySelector('#tabelPetugas tbody');
                tbody.innerHTML = "";
                
                if(res.data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>Belum ada pendaftar.</td></tr>";
                    return;
                }

                res.data.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td><b>${item.nama}</b><br><small>NISN: ${item.nisn}</small></td>
                            <td>${item.jalur}<br><small>${item.jarak} M</small></td>
                            <td>
                                ${item.berkas ? `<a href="${item.berkas}" target="_blank">Berkas</a>` : '-'}<br>
                                ${item.foto ? `<a href="${item.foto}" target="_blank">Foto</a>` : '-'}
                            </td>
                            <td>
                                <b>${item.status}</b><br>
                                <select id="sel_${item.row}" style="margin-top:4px; font-size:11px; padding:4px;">
                                    <option value="DITERIMA" ${item.status === 'DITERIMA' ? 'selected':''}>Diterima</option>
                                    <option value="DITOLAK" ${item.status === 'DITOLAK' ? 'selected':''}>Ditolak</option>
                                    <option value="Sedang Diproses" ${item.status === 'Sedang Diproses' ? 'selected':''}>Pending</option>
                                </select>
                                <input type="text" id="cat_${item.row}" value="${item.catatan}" placeholder="Catatan" style="font-size:11px; padding:4px; margin-top:3px;">
                                <button class="btn-update" onclick="simpanStatusPetugas(${item.row})">Simpan</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                alert(res.message);
            }
        });
    }

    function simpanStatusPetugas(row) {
        const st = document.getElementById(`sel_${row}`).value;
        const ct = document.getElementById(`cat_${row}`).value;
        
        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "updateStatus", pin: currentPin, row: row, status: st, catatan: ct })
        })
        .then(res => res.json())
        .then(res => {
            if(res.result === 'success') {
                alert("Status Berhasil Diperbarui!");
                loadDataPetugas();
            }
        });
    }
</script>

</body>
</html>
